<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>House & Local Weather</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <h1>Govee Sensors <span class="chip" id="count">0</span></h1>
  <div class="controls" id="toolbar">
    <div class="unit-toggle">
      <button id="unitF" class="btn active">°F</button>
      <button id="unitC" class="btn">°C</button>
    </div>

    <div class="theme-toggle">
      <button class="btn theme-btn" id="themeDark" title="Dark mode">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
      <button class="btn theme-btn" id="themeLight" title="Light mode">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 6a6 6 0 1 0 0 12A6 6 0 0 0 12 6Zm5.24 13.76 1.41 1.41 1.41-1.41-1.41-1.41-1.41 1.41ZM4.84 17.24 3.42 18.66l1.41 1.41 1.42-1.41-1.41-1.41Z"/></svg>
      </button>
    </div>

    <button class="btn icon-btn" id="compactToggleBtn" title="Compact"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2Zm0 6h12a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Zm0 6h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2Z"/></svg></button>
    <button class="btn icon-btn" id="reorderToggleBtn" title="Reorder"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7h14a1 1 0 1 0 0-2H3a1 1 0 1 0 0 2Zm0 6h10a1 1 0 1 0 0-2H3a1 1 0 1 0 0 2Zm0 6h14a1 1 0 1 0 0-2H3a1 1 0 1 0 0 2Z"/></svg></button>

    <button class="btn icon-btn refresh-wrapper" id="refreshBtn" title="Refresh">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7c2.76 0 5 2.24 5 5a5 5 0 1 1-8.66-3.54 1 1 0 1 0-1.41-1.42A7 7 0 1 0 19 12a6.98 6.98 0 0 0-1.35-5.65Z"/></svg>
      <div class="refresh-ring"></div>
    </button>
    
    <button class="btn icon-btn" id="resetOrderBtn" title="Reset"><svg class="icon" viewBox="0 0 24 24"><path d="M19 7v6a1 1 0 0 1-1 1H8.41l2.3 2.29a1 1 0 1 1-1.42 1.42l-4-4a1 1 0 0 1 0-1.42l4-4a1 1 0 1 1 1.42 1.42L8.41 12H17V7a1 1 0 1 1 2 0Z"/></svg></button>
  </div>
</header>

<main>
  <div id="notice" class="status"></div>

  <div class="dash-layout">
    <div class="sensor-column">
      <div class="grid" id="grid"></div>
    </div>

    <div class="weather-column">
      <div class="card" id="weatherCard">
        <div class="toprow">
          <div class="title">
            <div class="name">Local Weather</div>
            <div class="device skeleton" id="weatherLocation">Detecting location...</div>
          </div>
        </div>

        <div class="weather-reading">
          <div class="temp-wrap">
            <span class="temp skeleton" id="weatherTemp">—</span>
            <span class="unit">°F</span>
          </div>
          <div class="badges">
            <div id="weatherHumidity" class="skeleton" style="min-width:50px"></div>
            <div id="weatherWind" class="skeleton" style="min-width:60px"></div>
          </div>
        </div>

        <canvas class="spark" id="weatherForecast"></canvas>
        
        <div class="status" id="weatherStatus">Loading weather...</div>
        <div class="status skeleton" id="weatherDaily" style="min-height:14px; margin-top:4px; width:80%;"></div>
        
        <div id="weatherUpcoming" class="upcoming-forecast">
           <div class="forecast-tile skeleton"></div>
           <div class="forecast-tile skeleton"></div>
           <div class="forecast-tile skeleton"></div>
           <div class="forecast-tile skeleton"></div>
           <div class="forecast-tile skeleton"></div>
        </div>
		<div id="weatherUpcoming" class="upcoming-forecast"></div>

        <div id="almanacContainer" style="margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.1);">
          
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
             <div>
               <div style="color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:0.5px;">Historical Avg</div>
               <div style="font-weight:600; font-size:14px;">
                 <span id="almHigh">--</span>° / <span id="almLow">--</span>°
               </div>
             </div>
             <div style="text-align:right;">
               <div style="color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:0.5px;">Today vs 10yr</div>
               <div id="almDelta" style="font-weight:600; font-size:14px;">--</div>
             </div>
          </div>

          <div style="position:relative; height:45px;">
             <canvas id="sunCanvas" style="width:100%; height:100%; display:block;"></canvas>
             <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:-10px; position:relative; z-index:2;">
                <span id="sunriseText">--:--</span>
                <span id="sunsetText">--:--</span>
             </div>
          </div>
				<div id="almHistory"></div>
        </div>

        <div id="aiInsightsContainer" style="margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.1);">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <svg class="icon" style="width:16px; height:16px; fill:var(--accent);" viewBox="0 0 24 24">
              <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
            <span style="font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:0.5px;">AI Insights</span>
          </div>
          <div id="aiInsights" class="ai-insights-list"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="app.js" defer></script>
</body>
</html>
